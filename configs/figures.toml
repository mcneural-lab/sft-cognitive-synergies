[[figures]]
id = "si-model-scaling"
number = "SI Fig S4"
description = "Next-exemplar prediction accuracy across Gemini, GPT, Claude, Llama, and the n-gram baseline."
script = "src/sftbench/micro/prediction/plotting/new_plot_prediction_results.py"

[[figures]]
id = "si-cognitive-prompting"
number = "SI Fig S5 / Table S2"
description = "Theory-driven cognitive prompting vs zero-shot and few-shot baselines."
script = "src/sftbench/micro/prediction/plotting/new_plot_prediction_results.py"

[[figures]]
id = "si-llama-70b-prediction"
number = "SI Fig S7"
description = "Llama-3.3-70B next-exemplar prediction vs humans."
