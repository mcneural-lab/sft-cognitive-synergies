# Inventory of figures reproducible from this release.
#
# Each entry maps a figure id (as used by scripts/reproduce_figure.sh) to the
# script that produces it. Targets listed here are the complete set of
# manuscript figures that ship with code in this release.

[release]
scope = "PNAS code release accompanying Lacosse, Duarte, et al."
default_uses_api = false
data_policy = "public-release data and results"

[[figures]]
id = "figure-2b"
number = "Figure 2B"
description = "Macro-cognitive TPM Mantel correlation (Spearman rho)."
script = "src/sftbench/macro/plot_tpm_from_sequences.py"

[[figures]]
id = "figure-2c"
number = "Figure 2C"
description = "BLEU similarity across humans, TPM-LOO, and the Gemini model suite."
script = "src/sftbench/macro/plot_bleu_scores.py"

[[figures]]
id = "figure-2d"
number = "Figure 2D"
description = "Trajectory geometry (spectral gap, curvature)."
script = "src/sftbench/macro/geometric_ai_vs_human.py"

[[figures]]
id = "figure-3"
number = "Figure 3"
description = "Gemini-3-Pro vs humans on next-exemplar prediction."
script = "src/sftbench/micro/prediction/plotting/plot_human_vs_ai_next-exemplar_prediction-results.py"

[[figures]]
id = "figure-4abc"
number = "Figure 4A-C"
description = "Llama-3.3-70B perplexity on original vs mismatched-prefix vs shuffled sequences."
script = "src/sftbench/micro/llama/plot_prob_seq.py"

[[figures]]
id = "figure-4d"
number = "Figure 4D"
description = "Controlled, size-matched Jaccard generation overlap from seed vs longer human context."
script = "src/sftbench/micro/generative/plot_new_jaccard_control.py"

[[figures]]
id = "si-switch-prediction"
number = "SI Fig S1 / Table S1"
description = "Human vs AI switch-prediction accuracy overall, by category, and by rank."
